name: Hosted Windows native pre-auth capability
on:
  pull_request:
    paths:
      - .github/workflows/hosted-windows-native.yml
      - scripts/hosted-windows-native-preflight/**
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter hosted-windows-preauth
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-windows-native-preflight
  cancel-in-progress: false
jobs:
  preauth:
    if: github.repository == 'kazu-42/HonoWarden' && github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'hosted-windows-preauth') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'task/windows-hosted-native-preflight-')))
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      PACKET: scripts/hosted-windows-native-preflight
    steps:
      - name: Check out the exact reviewed probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check out the exact public company source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 2deeee0cf159da92babc86e09de44c12eea2aa93
          path: company
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Prepare only locked public dependencies
        working-directory: company
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $bootstrap=Join-Path $env:RUNNER_TEMP ('HonoWardenCorepack-'+[Guid]::NewGuid().ToString())
          if (Test-Path -LiteralPath $bootstrap) { throw 'bootstrap_existing_path_refused' }
          New-Item -ItemType Directory -Path $bootstrap | Out-Null
          try {
            npm install --prefix $bootstrap --no-save --package-lock=false --bin-links=false corepack@0.34.0 --ignore-scripts --no-audit --no-fund *> $null
            if ($LASTEXITCODE -ne 0) { throw 'corepack_bootstrap_failed' }
            $corepack=Join-Path $bootstrap 'node_modules/corepack/dist/corepack.js'
            $version=& node $corepack --version
            if ($LASTEXITCODE -ne 0 -or $version -ne '0.34.0') { throw 'corepack_pin_failed' }
            $version=& node $corepack pnpm --version
            if ($LASTEXITCODE -ne 0 -or $version -ne '11.8.0') { throw 'pnpm_pin_failed' }
            & node $corepack pnpm install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'locked_dependency_preparation_failed' }
          } finally {
            Remove-Item -LiteralPath $bootstrap -Recurse -Force
            if (Test-Path -LiteralPath $bootstrap) { throw 'bootstrap_cleanup_unproved' }
          }
      - name: Check source policy tests
        run: node --test "$env:PACKET/preflight.node-check.mjs"
      - name: Probe finite hosted Server pre-auth capabilities
        timeout-minutes: 5
        run: |
          & "$env:PACKET/preflight.ps1" -Execute -Company "$env:GITHUB_WORKSPACE/company"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently finish exact owned cleanup
        if: always()
        timeout-minutes: 2
        run: |
          & "$env:PACKET/preflight.ps1" -Finish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # No raw artifacts, profiles, screenshots, stdio or credential output are uploaded.
